<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Website</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .bg-slider {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            animation: changeBg 20s infinite;
        }

        @keyframes changeBg {
            0%   { background-image: url('27.jpg'); }
            25%  { background-image: url('28.jpg'); }
            50%  { background-image: url('29.jpg'); }
            75%  { background-image: url('30.jpg'); }
            100% { background-image: url('31.jpg'); }
        }

        header {
            text-align: center;
            padding: 40px;
            color: white;
            background: rgba(0,0,0,0.5);
            position: relative;
        }

        header h1 { font-size: 3rem; }
        header p { margin-top: 8px; font-size: 1.1rem; }

        .right-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .right-btn button {
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
        }

        .right-btn button:hover { transform: scale(1.05); }

        .register-btn { background: #1e90ff; }
        .register-btn:hover { background: #1a7fdc; }

        .admin-btn { background: #c0392b; }
        .admin-btn:hover { background: #a93226; }

        .content {
            text-align: center;
            padding: 80px 60px;
            color: white;
            font-size: 1.3rem;
            background: rgba(0,0,0,0.4);
            min-height: calc(100vh - 180px);
        }
        .content a {
            color: #FFD700;
            font-size: 1.4rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            padding: 14px 30px;
            border: 2px solid #FFD700;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .content a:hover { background: rgba(255,215,0,0.2); }
        footer {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            padding: 15px;
        }

        .help-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95rem;
            margin-left: 10px;
        }

        .help-btn:hover { background: #ff6b81; }
    </style>
</head>
<body>

    <div class="bg-slider"></div>

    <header>
        <h1>🛍️ Welcome to Our Online Shopping Website</h1>
        <p>Shop the best products with amazing discounts</p>

        <div class="right-btn">
            <button class="register-btn" onclick="window.location.href='register.html'">📝 Register</button>
            <button class="admin-btn"    onclick="window.location.href='admin_login.html'">🔐 Admin Login</button>
        </div>
    </header>

    <div class="content">
        <p>Discover a wide range of products at unbeatable prices!</p>
        <br>
        <a href="login.html">🛒 Login & Start Shopping</a>
    </div>

    <footer>
        <p style="display:inline;">&copy; 2025 Online Shopping | All Rights Reserved</p>
        <button class="help-btn" onclick="alert('Contact us at support@onlineshop.com')">❓ Help</button>
    </footer>

</body>
</html>
