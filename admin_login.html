<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: url("2.jpg") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 35px;
            border-radius: 15px;
            width: 380px;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .admin-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h2 {
            color: #c0392b;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .subtitle {
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin: 14px 0;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.3s;
            outline: none;
        }

        .input-group input:focus {
            border-color: #c0392b;
            box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.12);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 8px;
            background: #c0392b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #a93226;
        }

        .error-msg {
            display: none;
            color: #c0392b;
            background: #fdecea;
            border: 1px solid #f5c6c2;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #555;
            font-size: 14px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #c0392b;
            text-decoration: underline;
        }

        .divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 20px 0 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="admin-icon">🔐</div>
    <h2>Admin Login</h2>
    <p class="subtitle">This page is for authorized administrators only</p>

    <div class="input-group">
        <label>Admin Email</label>
        <input type="email" id="adminEmail" placeholder="Enter admin email" required>
    </div>

    <div class="input-group">
        <label>Admin ID</label>
        <input type="text" id="adminId" placeholder="Enter admin ID" required>
    </div>

    <button class="login-btn" onclick="adminLogin()">🔓 Login as Admin</button>

    <div class="error-msg" id="errorMsg">
        ❌ Invalid Email or Admin ID. Please try again.
    </div>

    <hr class="divider">
    <a href="index.html" class="back-link">⬅ Back to Home</a>
</div>

<script>
    // ✅ Admin credentials
    const ADMIN_EMAIL = "karthikvenkat062@gmail.com";
    const ADMIN_ID    = "192372092";

    function adminLogin() {
        let email = document.getElementById("adminEmail").value.trim();
        let id    = document.getElementById("adminId").value.trim();
        let errorMsg = document.getElementById("errorMsg");

        if (email === ADMIN_EMAIL && id === ADMIN_ID) {
            // ✅ Correct credentials → go to admin dashboard
            errorMsg.style.display = "none";
            alert("✅ Welcome Admin! Redirecting to dashboard...");
            window.location.href = "customer.php";
        } else {
            // ❌ Wrong credentials
            errorMsg.style.display = "block";
        }
    }

    // Allow pressing Enter to login
    document.addEventListener("keypress", function(e) {
        if (e.key === "Enter") adminLogin();
    });
</script>

</body>
</html>
