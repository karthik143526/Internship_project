<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: url("2.jpg") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #aaa;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #007BFF;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .register-link {
      margin-top: 15px;
    }

    .register-link a {
      color: green;
      text-decoration: none;
      font-weight: bold;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .back-btn button {
      background: #28a745;
    }

    .back-btn button:hover {
      background: #218838;
    }

  </style>
</head>

<body>

  <div class="container">

    <h2>Login</h2>

    <form action="login.php" method="post">

      <input type="email" name="email" placeholder="Email" required>

      <input type="password" name="password" placeholder="Password" required>

      <button type="submit">Login</button>

    </form>

    <div class="register-link">
      Don’t have an account? 
      <a href="register.html">Register here</a>
    </div>

    <div class="back-btn">
      <a href="index.html">
        <button type="button">Go Back</button>
      </a>
    </div>

  </div>

</body>
</html>
